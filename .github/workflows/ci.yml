name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install fixed development dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-dev.txt

      - name: Run complete test suite
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q experiments scripts tests twstock_data twstock_engine

      - name: Validate tracked JSON
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            python -m json.tool "$file" >/dev/null
          done < <(git ls-files '*.json')

      - name: Check changed lines for whitespace errors
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "${BASE_SHA}..${HEAD_SHA}"
          else
            git show --check --format=fuller "$HEAD_SHA" >/dev/null
          fi

      - name: Confirm test run did not modify tracked files
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --short --untracked-files=no)"
