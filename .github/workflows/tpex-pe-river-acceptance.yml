name: Temporary PE River Routing Acceptance

on:
  push:
    branches:
      - feat/tpex-pe-river-v0-1

permissions:
  contents: read

jobs:
  routing-controls:
    strategy:
      fail-fast: false
      matrix:
        include:
          - symbol: "6488"
            market: AUTO
          - symbol: "8103"
            market: TWSE
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check --requirement requirements-dev.txt
      - name: Generate routed MAX report
        run: >-
          python scripts/run_pe_river_report.py
          --symbol "${{ matrix.symbol }}" --market "${{ matrix.market }}" --max
          --output-dir "outputs/pe_river/${{ matrix.symbol }}"
          --cache-dir "$RUNNER_TEMP/cache/${{ matrix.market }}/${{ matrix.symbol }}"
          --timeout 60 --retries 3 --request-interval 0.1
      - name: Validate routed result and render PDF
        run: |
          set -euo pipefail
          python -m json.tool "outputs/pe_river/${{ matrix.symbol }}/report_metadata.json" >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pdftoppm -png -singlefile -r 120 \
            "outputs/pe_river/${{ matrix.symbol }}/${{ matrix.symbol }}_pe_river.pdf" \
            "outputs/pe_river/${{ matrix.symbol }}/pdf_preview"
          test -s "outputs/pe_river/${{ matrix.symbol }}/pdf_preview.png"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: routed-pe-river-${{ matrix.symbol }}-${{ matrix.market }}
          path: outputs/pe_river/${{ matrix.symbol }}
          if-no-files-found: error
          retention-days: 14

  explicit-market-mismatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --requirement requirements-dev.txt
      - name: Reject 6488 as TWSE
        run: |
          set -euo pipefail
          if python scripts/run_pe_river_report.py \
            --symbol 6488 --market TWSE --max \
            --output-dir outputs/mismatch --cache-dir "$RUNNER_TEMP/mismatch" \
            --timeout 60 --retries 3 --request-interval 0.1 \
            >mismatch.log 2>&1; then
            echo "6488_TWSE_UNEXPECTEDLY_SUCCEEDED"
            exit 1
          fi
          grep -F "not an officially identified TWSE ordinary common share" mismatch.log
